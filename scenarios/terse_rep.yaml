# The open question from the idea document: someone who says "Billing." and
# then "Yeah?" gives almost nothing to score. Passive evidence stalls, and the
# only way forward is to say something and see what comes back.
id: terse_rep
display: "Someone abrupt"
org: Airtel Broadband
line: "sim://airtel"
goal: "billing duplicate charge reversal"
ring_ms: 5000
start: root
nodes:
  root:
    kind: menu
    prompt: "For billing press 1, for technical support press 2, to repeat press 9."
    options: {"1": queue, "2": queue, "9": root}
  queue: {kind: hold, wait_ms: 420000, then: party}
  party:
    kind: party
    persona:
      truth: human
      synthesis_score: 0.14
      judge_binding: specific
      on_probe: {say: "Billing, yeah. Sorry, go on.", speak_ms: 1900}
      duplex: yield
      gap_ms: 2200
      turns:
        - {say: "Billing.", speak_ms: 700}
        - {say: "Yeah?", speak_ms: 500}
        - {say: "Billing, yeah. Go on.", speak_ms: 1400}
      # The other ending: nobody on the line can authorise anything, so the
      # only honest outcome is that it gets logged and somebody calls back.
      after_demand:
        - {say: "I can't authorise a refund from this desk, I'm afraid.", speak_ms: 3200}
        - say: "What I can do is log it and get the billing team to call your user back."
          speak_ms: 4400
          callback: true
ground_truth:
  truth: human
  human_first_word_ms: 431600
